<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer interactive panel frame -->
  <rect x="56" y="76" width="400" height="280" rx="24" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  <rect x="72" y="92" width="368" height="248" rx="16" fill="#090d16"/>
  
  <!-- Panel display content / chart and board lines -->
  <path d="M100 280 L180 200 L260 230 L340 150 L410 190" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="200" r="8" fill="#60a5fa"/>
  <circle cx="260" cy="230" r="8" fill="#60a5fa"/>
  <circle cx="340" cy="150" r="10" fill="#38bdf8"/>
  <circle cx="410" cy="190" r="8" fill="#60a5fa"/>
  
  <!-- Stand / Base of Interactive Panel -->
  <rect x="232" y="356" width="48" height="56" fill="#334155" rx="4"/>
  <path d="M160 412 L352 412 L372 432 L140 432 Z" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Stylus Pen Overlay with glow -->
  <g filter="url(#glow)">
    <path d="M370 110 L440 180 L320 300 L280 305 L285 265 Z" fill="url(#accentGrad)"/>
    <polygon points="280,305 270,320 295,310" fill="#f8fafc"/>
    <circle cx="270" cy="320" r="3" fill="#38bdf8"/>
  </g>
</svg>
